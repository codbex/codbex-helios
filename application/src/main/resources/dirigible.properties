# General
DIRIGIBLE_MULTI_TENANT_MODE=false

# Land on the Workbench IDE, not on the platform's Home launchpad (the 14.16.0+ default is
# services/web/home/). This is a tooling edition, so the IDE is home.
DIRIGIBLE_HOME_URL=services/web/shell-ide/

DIRIGIBLE_PRODUCT_NAME=${project.title}
DIRIGIBLE_PRODUCT_VERSION=${project.version}
DIRIGIBLE_PRODUCT_COMMIT_ID=${git.commit.id}
DIRIGIBLE_PRODUCT_REPOSITORY=https://github.com/codbex/codbex-helios
DIRIGIBLE_PRODUCT_TYPE=javascript

DIRIGIBLE_INSTANCE_NAME=helios

DIRIGIBLE_BRANDING_NAME=Helios
DIRIGIBLE_BRANDING_BRAND=codbex
DIRIGIBLE_BRANDING_BRAND_URL=https://www.codbex.com/
DIRIGIBLE_BRANDING_FAVICON=/services/web/helios-branding/images/favicon.ico
DIRIGIBLE_BRANDING_LOGO=/services/web/helios-branding/images/logo.svg
DIRIGIBLE_BRANDING_THEME=blimpkit-auto
DIRIGIBLE_BRANDING_PREFIX=codbex-helios